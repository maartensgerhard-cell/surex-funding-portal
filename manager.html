<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b35"><title>SureX | Manager Dashboard</title>
<style>
:root{--navy:#061b35;--blue:#087dbb;--cyan:#16c5dc;--ink:#172b43;--muted:#66788a;--line:#dce5ed;--bg:#f3f7fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}header{background:linear-gradient(115deg,var(--navy),#0a4776);color:#fff;padding:25px 20px}.head,main{max-width:1100px;margin:auto}.brand{font-size:23px;font-weight:800;letter-spacing:2px}.brand span{color:var(--cyan)}header p{margin:7px 0 0;color:#d5e9f5}main{padding:26px 18px 60px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:22px;margin-bottom:18px;box-shadow:0 8px 26px #0b2a4510}h1{font-size:26px;margin:0 0 8px}h2{font-size:18px;margin:0 0 15px;color:var(--navy)}p{line-height:1.5}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd7e1;border-radius:8px;font:inherit}button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 17px;font-weight:bold;cursor:pointer;margin:5px 6px 5px 0}button.secondary{background:#eaf1f6;color:var(--navy)}button.danger{background:#a83232}button:disabled{opacity:.55}.hidden{display:none}.notice{padding:12px;border-radius:8px;margin:12px 0;background:#eaf5fa}.error{background:#fff0ef;color:#8c2923}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#f3f7fa;padding:13px 17px;border-radius:9px;min-width:140px}.stat strong{display:block;font-size:24px;color:var(--navy)}.request{border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}.request-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.status{font-size:12px;font-weight:bold;padding:5px 9px;border-radius:20px;background:#edf2f6}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.details div{font-size:14px}.details b{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.decision{margin-top:14px}.decision textarea{min-height:70px}.small{font-size:12px;color:var(--muted)}@media(max-width:650px){.details{grid-template-columns:1fr}.card{padding:17px}}
</style></head><body>
<header><div class="head"><div class="brand">SURE<span>X</span></div><p>Funding &amp; Event Management · Regional Manager</p></div></header>
<main><section id="login" class="card"><h1>Manager sign in</h1><p class="muted">This area is restricted to the authorised regional manager.</p><form id="loginForm"><label>Email address</label><input id="email" type="email" value="Gerhardm@surex.insure" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><p><button id="loginBtn">Sign in</button></p></form><div id="loginMsg" class="notice hidden"></div></section>
<section id="dashboard" class="hidden"><div class="card"><div class="request-top"><div><h1>Funding applications</h1><p class="muted">Review, approve or decline adviser funding requests.</p></div><div><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="logout">Sign out</button></div></div><div class="stats"><div class="stat"><strong id="total">0</strong><span>Total requests</span></div><div class="stat"><strong id="pending">0</strong><span>Awaiting approval</span></div><div class="stat"><strong id="approved">0</strong><span>Approved</span></div><div class="stat"><strong id="declined">0</strong><span>Declined</span></div></div><div id="dashMsg" class="notice hidden"></div></div><div class="card"><h2>Applications</h2><div id="requests"></div></div></section>
</main>
<script>
const SUPABASE_URL="https://cqxhlgrumewrorzoilbh.supabase.co";
const SUPABASE_KEY= "REPLACE_WITH_PUBLISHABLE_KEY";
let accessToken=sessionStorage.getItem("surex_manager_token")||"";
const $=id=>document.getElementById(id);
function showMessage(el,msg,error=false){el.textContent=msg;el.classList.remove("hidden");el.classList.toggle("error",error)}
async function auth(path,body){const r=await fetch(SUPABASE_URL+"/auth/v1/"+path,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.message||d.error_description||"Sign-in failed.");return d}
async function api(method="GET",body){const r=await fetch("/.netlify/functions/manager-requests",{method,headers:{"Authorization":"Bearer "+accessToken,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed.");return d}
async function load(){try{const d=await api();render(d.requests||[]);$("dashMsg").classList.add("hidden")}catch(e){showMessage($("dashMsg"),e.message,true);if(e.message.toLowerCase().includes("unauthorised"))logout()}}
function money(v){return new Intl.NumberFormat("en-ZA",{style:"currency",currency:"ZAR"}).format(Number(v||0))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(items){$("total").textContent=items.length;$("pending").textContent=items.filter(x=>x.status==="pending_approval").length;$("approved").textContent=items.filter(x=>x.status==="approved"||x.status==="awaiting_documentation"||x.status==="completed").length;$("declined").textContent=items.filter(x=>x.status==="declined").length;
$("requests").innerHTML=items.length?items.map(x=>'<article class="request"><div class="request-top"><div><b>'+esc(x.request_reference||"Funding request")+' · '+esc(x.first_name)+' '+esc(x.surname)+'</b><div class="small">'+esc(x.branch)+' · Submitted '+new Date(x.created_at).toLocaleString("en-ZA")+'</div></div><span class="status">'+esc((x.status||"").replaceAll("_"," ").toUpperCase())+'</span></div><div class="details"><div><b>Event</b>'+esc(x.event_type)+' — '+esc(x.event_date)+'</div><div><b>Funding requested</b>'+money(x.requested_amount)+'</div><div><b>Venue</b>'+esc(x.venue)+'</div><div><b>Expected attendees</b>'+esc(x.expected_attendees)+'</div><div><b>Adviser email</b>'+esc(x.adviser_email)+'</div><div><b>Actual attendees</b>'+esc(x.actual_attendees??"Not submitted")+'</div></div><p><b>Funding breakdown</b><br>'+esc(x.funding_breakdown).replaceAll("\n","<br>")+'</p>'+(x.additional_notes?'<p><b>Additional notes</b><br>'+esc(x.additional_notes)+'</p>':"")+(x.manager_comment?'<p><b>Manager comment</b><br>'+esc(x.manager_comment)+'</p>':"")+(x.status==="pending_approval"?'<div class="decision"><label for="comment-'+esc(x.id)+'">Decision comment (optional)</label><textarea id="comment-'+esc(x.id)+'" placeholder="Add a note for the adviser"></textarea><p><button data-id="'+esc(x.id)+'" data-status="approved">Approve funding</button><button class="danger" data-id="'+esc(x.id)+'" data-status="declined">Decline</button></p></div>':"")+'</article>').join(""):'<p class="muted">No funding applications found.</p>'}
$("requests").addEventListener("click",async e=>{const b=e.target.closest("button[data-id]");if(!b)return;const status=b.dataset.status;const action=status==="approved"?"approve":"decline";if(!confirm("Are you sure you want to "+action+" this funding request?"))return;b.disabled=true;try{await api("POST",{id:b.dataset.id,status,comment:$("comment-"+b.dataset.id)?.value||""});await load()}catch(err){showMessage($("dashMsg"),err.message,true);b.disabled=false}});
function logout(){accessToken="";sessionStorage.removeItem("surex_manager_token");$("dashboard").classList.add("hidden");$("login").classList.remove("hidden");$("password").value=""}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginBtn").disabled=true;try{const d=await auth("token?grant_type=password",{email:$("email").value,password:$("password").value});if(d.user?.email?.toLowerCase()!=="gerhardm@surex.insure")throw new Error("This login is not authorised for the manager dashboard.");accessToken=d.access_token;sessionStorage.setItem("surex_manager_token",accessToken);$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");await load()}catch(err){showMessage($("loginMsg"),err.message,true)}finally{$("loginBtn").disabled=false}});
$("refresh").addEventListener("click",load);$("logout").addEventListener("click",logout);
if(accessToken){$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");load()}
</script></body></html>
