<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b35"><title>SureX | Reset Manager Password</title>
<style>
:root{--navy:#061b35;--blue:#087dbb;--cyan:#16c5dc;--ink:#172b43;--muted:#66788a;--line:#dce5ed}
*{box-sizing:border-box}body{margin:0;background:#f3f7fa;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}header{background:linear-gradient(115deg,var(--navy),#0a4776);color:#fff;padding:28px 20px}.head{max-width:900px;margin:auto}.brand{font-weight:800;letter-spacing:2px;font-size:24px}.brand span{color:var(--cyan)}header p{margin:8px 0 0;color:#d5e9f5}.wrap{max-width:480px;margin:60px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 8px 26px #0b2a4510}h1{font-size:24px;color:var(--navy);margin:0 0 8px}p{color:var(--muted);line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #cbd7e1;border-radius:8px;font:inherit}button{width:100%;margin-top:20px;background:var(--blue);color:white;border:0;border-radius:9px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.notice{padding:12px;border-radius:8px;margin-top:16px;background:#fff0ef;color:#8c2923}.success{background:#e8f7f8;color:#07536a}a{color:var(--blue);text-decoration:none;font-size:13px}
</style></head><body><header><div class="head"><div class="brand">SURE<span>X</span></div><p>Adviser Funding &amp; Event Management</p></div></header>
<main class="wrap"><form class="card" id="resetForm"><h1>Reset manager password</h1><p>Enter a new password for the authorised manager account.</p><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="saveButton">Update password</button><div id="message" class="notice" role="status">Checking your recovery link…</div></form></main>
<script>
const form=document.getElementById('resetForm'),msg=document.getElementById('message'),btn=document.getElementById('saveButton');
const params=new URLSearchParams(location.hash.replace(/^#/,''));
const accessToken=params.get('access_token'),type=params.get('type');
if(!accessToken||type!=='recovery'){form.style.display='none';msg.textContent='This recovery link is missing or has expired. Return to manager sign-in and request a new link.';msg.style.display='block';}
else{msg.textContent='Recovery link verified. Choose your new password below.';msg.classList.add('success');}
form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){msg.textContent='The passwords do not match.';msg.classList.remove('success');return;}btn.disabled=true;btn.textContent='Updating…';try{const r=await fetch('/.netlify/functions/manager-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update_password',access_token:accessToken,password})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.message||d.error_description||'Could not update password.');msg.textContent='Your password has been updated. You can now sign in.';msg.classList.add('success');form.querySelectorAll('input,button').forEach(x=>x.disabled=true);const a=document.createElement('a');a.href='/manager-login.html';a.textContent='Go to manager sign-in';a.style.display='inline-block';a.style.marginTop='16px';form.appendChild(a);history.replaceState(null,'',location.pathname);}catch(x){msg.textContent=x.message;msg.classList.remove('success');}finally{btn.disabled=false;btn.textContent='Update password';}});
</script></body></html>
