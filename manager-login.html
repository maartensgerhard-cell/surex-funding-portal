<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b35"><title>SureX | Manager Sign in</title>
<style>
:root{--navy:#061b35;--blue:#087dbb;--cyan:#16c5dc;--ink:#172b43;--muted:#66788a;--line:#dce5ed}
*{box-sizing:border-box}body{margin:0;background:#f3f7fa;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}header{background:linear-gradient(115deg,var(--navy),#0a4776);color:#fff;padding:28px 20px}.head{max-width:900px;margin:auto}.brand{font-weight:800;letter-spacing:2px;font-size:24px}.brand span{color:var(--cyan)}header p{margin:8px 0 0;color:#d5e9f5}.wrap{max-width:480px;margin:60px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 8px 26px #0b2a4510}h1{font-size:24px;color:var(--navy);margin:0 0 8px}p{color:var(--muted);line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #cbd7e1;border-radius:8px;font:inherit}button{width:100%;margin-top:20px;background:var(--blue);color:white;border:0;border-radius:9px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.notice{display:none;padding:12px;border-radius:8px;margin-top:16px;background:#fff0ef;color:#8c2923}.success{background:#e8f7f8;color:#07536a}a{color:var(--blue);text-decoration:none;font-size:13px}.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
</style></head><body><header><div class="head"><div class="brand">SURE<span>X</span></div><p>Adviser Funding &amp; Event Management</p></div></header>
<main class="wrap"><form class="card" id="loginForm"><h1>Manager sign in</h1><p>This area is restricted to authorised SureX management.</p><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required value="Gerhardm@surex.insure"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton">Sign in</button><div id="error" class="notice" role="alert"></div><div class="links"><a href="#" id="forgotLink">Forgot password?</a><a href="/">← Funding application</a></div></form></main>
<script>
const form=document.getElementById('loginForm'),btn=document.getElementById('loginButton'),err=document.getElementById('error');\ndocument.getElementById('forgotLink').addEventListener('click',async e=>{e.preventDefault();err.style.display='block';err.textContent='Sending password reset link…';try{const r=await fetch('/.netlify/functions/manager-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request_password_reset',email:document.getElementById('email').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not send reset link.');err.textContent='If the manager account exists, a password reset email has been sent. Check your inbox and spam folder.';}catch(x){err.textContent=x.message;}});
form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='Signing in…';try{const r=await fetch('/.netlify/functions/manager-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Sign in failed.');sessionStorage.setItem('surex_manager_token',d.access_token);location.href='/manager.html';}catch(x){err.textContent=x.message;err.style.display='block';}finally{btn.disabled=false;btn.textContent='Sign in';}});
</script></body></html>
